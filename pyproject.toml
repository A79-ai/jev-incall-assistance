[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-incall-assistance"
version = "0.1.0"
description = "Live in-call assistance with Jev, using MEDDPICC as a worked example"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ampup Team"}]
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
jev-incall = "jev_incall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_incall"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
